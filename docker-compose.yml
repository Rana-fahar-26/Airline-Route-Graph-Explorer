version: "3.9"

services:

  mongodb:
    image: mongo:7
    container_name: aerograph-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    container_name: aerograph-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  app:
    build: .
    container_name: aerograph-app
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=password
    depends_on:
      - mongodb
      - neo4j
    restart: unless-stopped
    command: >
      sh -c "python setup_db.py && python app.py"

volumes:
  mongo_data:
  neo4j_data:
